# Carga estos módulos en httpd.conf si aún no aparecen activos:
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so

<VirtualHost *:80>
    ServerName localhost
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Prefix "/vitalmetrics"
    ProxyPassMatch "^/vitalmetrics/(?:login|logout|registrar|validar_login)\.php$" !
    AliasMatch "^/vitalmetrics/(login|logout|registrar|validar_login)\.php$" "C:/Users/linet/OneDrive/Desktop/Vitalmetrics/$1.php"
    <Directory "C:/Users/linet/OneDrive/Desktop/Vitalmetrics">
        Options -Indexes
        Require all granted
    </Directory>
    ProxyPass /vitalmetrics/ http://127.0.0.1:5001/ retry=0
    ProxyPassReverse /vitalmetrics/ http://127.0.0.1:5001/
</VirtualHost>
